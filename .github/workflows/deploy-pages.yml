name: Deploy CloudPath prototype to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "cloudpath-development/cloudpath-az900-prototype/**"
      - "docs/**"
      - "demo.html"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare CloudPath site
        run: |
          mkdir -p site
          cp cloudpath-development/cloudpath-az900-prototype/index.html site/index.html
          cp -R cloudpath-development/cloudpath-az900-prototype/assets site/assets
          cp -R docs site/docs
          cp demo.html site/demo.html

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
